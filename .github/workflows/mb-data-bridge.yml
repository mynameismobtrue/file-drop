# V3.6 protocol audit trigger — comment-only, no logic change
name: Update Mercado Bitcoin snapshot

on:
  push:
    branches: ["main"]
    paths:
      - "mb-data-bridge/fetch_mb_snapshot.py"
      - ".github/workflows/mb-data-bridge.yml"
  schedule:
    # Snapshot regular para auditoria/fallback.
    - cron: "*/5 * * * *"
    # Janelas redundantes que mantêm o branch mb-live fresco ao redor de 08:30 BRT = 11:30 UTC.
    - cron: "5 11 * * *"
    - cron: "15 11 * * *"
    - cron: "25 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regular-snapshot:
    if: github.event_name != 'schedule' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: mb-regular-snapshot
      cancel-in-progress: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Fetch Mercado Bitcoin data
        run: python3 mb-data-bridge/fetch_mb_snapshot.py

      - name: Validate generated files
        run: |
          test -s mb-data-bridge/snapshot.txt
          test -s mb-data-bridge/snapshot.json
          grep -q '^SOURCE=MERCADO_BITCOIN$' mb-data-bridge/snapshot.txt
          grep -q '^PAIR=BTC-BRL$' mb-data-bridge/snapshot.txt

      - name: Commit regular snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mb-data-bridge/snapshot.txt mb-data-bridge/snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "Update MB BTC-BRL snapshot"
          git push

  live-burst:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: mb-live-burst
      cancel-in-progress: true
    steps:
      - name: Checkout main with branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare dedicated mb-live worktree
        run: |
          git fetch origin mb-live
          git worktree add /tmp/mb-live origin/mb-live
          cd /tmp/mb-live
          git checkout -B mb-live origin/mb-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Keep MB live snapshot fresh
        shell: bash
        run: |
          # Push/manual changes create a 10-minute validation window.
          # Scheduled bursts last 30 minutes. With redundant starts at 11:05/11:15/11:25 UTC
          # and cancel-in-progress, the final scheduled runner should cover roughly 08:25–08:55 BRT,
          # leaving enough room for research, final execution refresh, materiality check and publication.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DURATION=1800
          else
            DURATION=600
          fi
          END=$(( $(date +%s) + DURATION ))

          while [ "$(date +%s)" -lt "$END" ]; do
            cd "$GITHUB_WORKSPACE"
            python3 mb-data-bridge/fetch_mb_snapshot.py

            mkdir -p /tmp/mb-live/mb-data-bridge
            cp mb-data-bridge/snapshot.txt /tmp/mb-live/mb-data-bridge/snapshot.txt
            cp mb-data-bridge/snapshot.json /tmp/mb-live/mb-data-bridge/snapshot.json

            cd /tmp/mb-live
            test -s mb-data-bridge/snapshot.txt
            grep -q '^SOURCE=MERCADO_BITCOIN$' mb-data-bridge/snapshot.txt
            grep -q '^PAIR=BTC-BRL$' mb-data-bridge/snapshot.txt
            git add mb-data-bridge/snapshot.txt mb-data-bridge/snapshot.json

            # mb-live é branch técnico descartável. Amenda sempre o mesmo commit para não poluir histórico.
            git commit --amend --no-edit --allow-empty
            git push --force origin HEAD:mb-live

            sleep 20
          done
