name: BTC Visualize public health

on:
  workflow_run:
    workflows: ["Deploy static site to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-visualize-public-health
  cancel-in-progress: true

jobs:
  public-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validation script
        uses: actions/checkout@v4

      - name: Verify permanent visual and report contract
        shell: bash
        env:
          BASE_URL: https://mynameismobtrue.github.io/file-drop/btc-committee
        run: |
          set -euo pipefail
          CACHE_BUSTER="$(date +%s)"
          SUCCESS=0
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "${BASE_URL}/?health=${CACHE_BUSTER}" -o /tmp/btc-visual.html && \
               grep -q 'data-btc-visualize="v1"' /tmp/btc-visual.html && \
               curl --fail --silent --show-error "${BASE_URL}/latest.json?health=${CACHE_BUSTER}" -o /tmp/latest.json && \
               curl --fail --silent --show-error "${BASE_URL}/health.json?health=${CACHE_BUSTER}" -o /tmp/health.json; then
              SUCCESS=1
              break
            fi
            sleep 5
          done
          test "$SUCCESS" -eq 1
          python3 btc-committee/validate_report.py /tmp/latest.json
          python3 - <<'PY'
          import json
          health = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert health['status'] == 'OK'
          assert health['service'] == 'btc-committee-visual'
          assert health['native_visualize_required'] is False
          print('PUBLIC_VISUAL_HEALTH=PASS')
          PY
