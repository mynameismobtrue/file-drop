name: BTC Visualize contract CI

on:
  pull_request:
    paths:
      - "btc-committee/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/btc-visualize-*.yml"
  push:
    branches: ["main"]
    paths:
      - "btc-committee/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/btc-visualize-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable report envelope
        run: python3 btc-committee/validate_report.py btc-committee/latest.json

      - name: Validate static assets
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-btc-visualize="v1"' btc-committee/index.html
          grep -q 'href="style.css"' btc-committee/index.html
          grep -q 'src="app.js"' btc-committee/index.html
          test -s btc-committee/style.css
          test -s btc-committee/app.js
          node --check btc-committee/app.js

      - name: Serve and smoke test locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory . >/tmp/btc-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/btc-committee/ | grep -q 'data-btc-visualize="v1"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/btc-committee/app.js | grep -q '__BTC_VISUALIZE_READY__'
          curl --fail --silent http://127.0.0.1:8080/btc-committee/latest.json | python3 btc-committee/validate_report.py -
          curl --fail --silent http://127.0.0.1:8080/btc-committee/health.json | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"]=="OK" and h["native_visualize_required"] is False'
