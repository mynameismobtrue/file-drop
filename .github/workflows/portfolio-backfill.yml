name: Backfill MB portfolio history

on:
  push:
    branches: ["main"]
    paths:
      - "portfolio-history/backfill-request.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mb-portfolio-backfill
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backfill requested 16h30 BRT portfolio marks
        shell: bash
        run: |
          test -s portfolio-history/backfill-request.txt
          while IFS= read -r TARGET_DATE; do
            TARGET_DATE="$(echo "$TARGET_DATE" | tr -d '[:space:]')"
            [ -z "$TARGET_DATE" ] && continue
            echo "$TARGET_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
            echo "Backfilling ${TARGET_DATE} at 16:30 BRT using official Mercado Bitcoin history."
            python3 mb-data-bridge/archive_portfolio_mark.py --date "$TARGET_DATE"
            test -s "portfolio-history/${TARGET_DATE}-1630-BRT.json"
            grep -q '"source": "MERCADO_BITCOIN"' "portfolio-history/${TARGET_DATE}-1630-BRT.json"
            grep -q '"not_for_research_reference": true' "portfolio-history/${TARGET_DATE}-1630-BRT.json"
          done < portfolio-history/backfill-request.txt

      - name: Commit backfilled history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-history
          if git diff --cached --quiet; then
            echo "No backfill changes."
            exit 0
          fi
          git commit -m "Backfill MB 16h30 portfolio history"
          git pull --rebase origin main
          git push
