name: Flight Data Bridge Monitor

on:
  schedule:
    - cron: "0 0,9,14,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-data-bridge-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
      PRODUCTION_CODE_SHA: c90d3fd396192d52e8181c4a3e030635858f034b
      FLIGHT_BRIDGE_CODE_DIR: ${{ github.workspace }}/code/flight-data-bridge

    steps:
      - name: Checkout live-data storage branch
        uses: actions/checkout@v4
        with:
          ref: flight-live-data
          path: live-repo
          fetch-depth: 0

      - name: Require Ignav secret without printing it
        shell: bash
        run: |
          if [ -z "${IGNAV_API_KEY:-}" ]; then
            echo "AUTH_REQUIRED: IGNAV_API_KEY Actions secret missing"
            exit 44
          fi

      - name: Checkout pinned production code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_CODE_SHA }}
          path: code
          persist-credentials: false

      - name: Verify exact production code SHA
        shell: bash
        run: |
          ACTUAL=$(git -C code rev-parse HEAD)
          if [ "$ACTUAL" != "$PRODUCTION_CODE_SHA" ]; then
            echo "CODE_SHA_MISMATCH"
            exit 45
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge dependencies
        run: pip install -r code/flight-data-bridge/requirements.txt

      - name: Stage production runtime and previous quota
        shell: bash
        run: |
          mkdir -p code/flight-data-bridge/private-env-template/config
          mkdir -p code/flight-data-bridge/private-env-template/live
          cp live-repo/flight-live/config/live-validation.json code/flight-data-bridge/private-env-template/config/live-validation.json
          cp live-repo/flight-live/live/quota.json code/flight-data-bridge/private-env-template/live/quota.json
          python - <<'PY'
          import json, os
          p='code/flight-data-bridge/private-env-template/config/live-validation.json'
          d=json.load(open(p))
          d['state']='PRODUCTION_VALIDATED'
          d['approved_code_sha']=os.environ['PRODUCTION_CODE_SHA']
          d['schedule_enabled']=True
          d['alert_delivery_enabled']=False
          d['paid_usage_authorized']=False
          d['public_live_data_authorized']=True
          json.dump(d,open(p,'w'),ensure_ascii=False,indent=2)
          PY

      - name: Free-tier quota gate
        run: python code/flight-data-bridge/private-env-template/scripts/private_runtime.py quota-check

      - name: Build Ignav-only runtime config
        run: python code/flight-data-bridge/private-env-template/scripts/private_runtime.py runtime-config --output "$RUNNER_TEMP/live-runtime.json"

      - name: Execute scheduled 12-query cycle
        id: bridge
        shell: bash
        run: |
          set +e
          PYTHONPATH="$FLIGHT_BRIDGE_CODE_DIR" python -m flight_bridge.bridge \
            --out-dir "$RUNNER_TEMP/flight-output" \
            --config "$RUNNER_TEMP/live-runtime.json"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized runtime artifacts
        if: always() && steps.bridge.outcome == 'success'
        run: |
          python code/flight-data-bridge/private-env-template/scripts/private_runtime.py persist \
            --output-dir "$RUNNER_TEMP/flight-output" \
            --health-file "$RUNNER_TEMP/no-health.json"

      - name: Secret scan before persistence
        if: always() && steps.bridge.outcome == 'success'
        run: python code/flight-data-bridge/private-env-template/scripts/private_runtime.py scan

      - name: Validate successful cycle completeness
        if: steps.bridge.outputs.exit_code == '0'
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('code/flight-data-bridge/private-env-template/live/last-attempt.json'))
          m=d['SEARCH_METADATA']
          assert m['IS_COMPLETE'] is True
          assert m['SEARCH_STATUS'] in {'COMPLETE','COMPLETE_WITH_SOURCE_ERRORS'}
          p=next(x for x in d['PROVIDER_RESULTS'] if x['provider']=='IGNAV')
          assert p['PROVIDER_QUERIES_EXPECTED']==12
          assert p['PROVIDER_QUERIES_STARTED']==12
          assert p['PROVIDER_QUERIES_COMPLETE']==12
          assert p['PROVIDER_QUERIES_FAILED']==0
          assert p['PROVIDER_QUERIES_TIMED_OUT']==0
          assert p['QUERY_GRID_VALID'] is True
          assert d['PROTOCOL_VERSION']=='LISBOA_V2.2'
          PY

      - name: Copy sanitized artifacts to live-data branch
        if: always() && steps.bridge.outcome == 'success'
        shell: bash
        run: |
          mkdir -p live-repo/flight-live/live live-repo/flight-live/history live-repo/flight-live/price-history live-repo/flight-live/audit
          for d in live history price-history audit; do
            SRC="code/flight-data-bridge/private-env-template/$d"
            DST="live-repo/flight-live/$d"
            if [ -d "$SRC" ]; then cp -a "$SRC/." "$DST/"; fi
          done

      - name: Commit sanitized cycle artifacts
        if: always() && steps.bridge.outcome == 'success'
        shell: bash
        run: |
          cd live-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-live/live flight-live/history flight-live/price-history flight-live/audit
          if git diff --cached --quiet; then
            echo "No sanitized changes."
          else
            git commit -m "Record Flight Data Bridge production cycle"
            git pull --rebase origin flight-live-data
            git push origin HEAD:flight-live-data
          fi

      - name: Propagate non-conclusive cycle
        if: steps.bridge.outputs.exit_code != '0'
        run: |
          echo "SEARCH_INCOMPLETE or provider failure; sanitized audit retained when available."
          exit 46
