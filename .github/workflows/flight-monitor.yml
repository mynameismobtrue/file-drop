name: Flight Data Bridge Monitor

on:
  schedule:
    - cron: "0 0,9,14,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-data-bridge-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
      PRODUCTION_CODE_SHA: c90d3fd396192d52e8181c4a3e030635858f034b
      FLIGHT_BRIDGE_CODE_DIR: ${{ github.workspace }}/code/flight-data-bridge

    steps:
      - name: Checkout live-data storage branch
        uses: actions/checkout@v4
        with:
          ref: flight-live-data
          path: live-repo
          fetch-depth: 0

      - name: Require Ignav secret without printing it
        shell: bash
        run: |
          if [ -z "${IGNAV_API_KEY:-}" ]; then
            echo "AUTH_REQUIRED: IGNAV_API_KEY Actions secret missing"
            exit 44
          fi

      - name: Checkout pinned production code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_CODE_SHA }}
          path: code
          persist-credentials: false

      - name: Verify exact production code SHA
        shell: bash
        run: |
          ACTUAL=$(git -C code rev-parse HEAD)
          if [ "$ACTUAL" != "$PRODUCTION_CODE_SHA" ]; then
            echo "CODE_SHA_MISMATCH"
            exit 45
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge dependencies
        run: pip install -r code/flight-data-bridge/requirements.txt

      - name: Stage production runtime and previous quota
        shell: bash
        run: |
          mkdir -p code/flight-data-bridge/private-env-template/config
          mkdir -p code/flight-data-bridge/private-env-template/live
          cp live-repo/flight-live/config/live-validation.json code/flight-data-bridge/private-env-template/config/live-validation.json
          cp live-repo/flight-live/live/quota.json code/flight-data-bridge/private-env-template/live/quota.json
          python - <<'PY'
          import json, os
          p='code/flight-data-bridge/private-env-template/config/live-validation.json'
          d=json.load(open(p))
          d['state']='PRODUCTION_VALIDATED'
          d['approved_code_sha']=os.environ['PRODUCTION_CODE_SHA']
          d['schedule_enabled']=True
          d['alert_delivery_enabled']=False
          d['paid_usage_authorized']=False
          d['public_live_data_authorized']=True
          json.dump(d,open(p,'w'),ensure_ascii=False,indent=2)
          PY

      - name: Free-tier quota gate for primary cycle
        run: python code/flight-data-bridge/private-env-template/scripts/private_runtime.py quota-check

      - name: Build Ignav-only primary runtime config
        run: python code/flight-data-bridge/private-env-template/scripts/private_runtime.py runtime-config --output "$RUNNER_TEMP/live-runtime.json"

      - name: Execute scheduled primary 12-query cycle
        id: bridge_primary
        shell: bash
        run: |
          set +e
          PYTHONPATH="$FLIGHT_BRIDGE_CODE_DIR" python -m flight_bridge.bridge \
            --out-dir "$RUNNER_TEMP/flight-output-primary" \
            --config "$RUNNER_TEMP/live-runtime.json"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized primary artifacts
        if: always() && steps.bridge_primary.outcome == 'success'
        run: |
          python code/flight-data-bridge/private-env-template/scripts/private_runtime.py persist \
            --output-dir "$RUNNER_TEMP/flight-output-primary" \
            --health-file "$RUNNER_TEMP/no-health.json"

      - name: Decide whether targeted 04 Nov fallback is needed
        id: fallback_gate
        if: steps.bridge_primary.outputs.exit_code == '0'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p='code/flight-data-bridge/private-env-template/live/last-attempt.json'
          d=json.load(open(p))
          preferred=False
          for o in d.get('ALERT_CANDIDATES', []):
              ob=o.get('outbound') or {}
              ib=o.get('inbound') or {}
              dep=(ob.get('departure_local') or '')[:10]
              arr=(ob.get('arrival_date_local') or ob.get('arrival_local') or '')[:10]
              ret=(ib.get('departure_local') or '')[:10]
              if dep=='2026-10-26' and arr=='2026-10-27' and ret=='2026-11-03':
                  preferred=True
                  break
          print('run_fallback=' + ('false' if preferred else 'true'))
          print('preferred_primary_found=' + ('true' if preferred else 'false'))
          PY

      - name: Backup primary active state before fallback
        if: steps.fallback_gate.outputs.run_fallback == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/primary-active-state"
          for f in last-attempt.json status.json last-complete.json; do
            SRC="code/flight-data-bridge/private-env-template/live/$f"
            if [ -f "$SRC" ]; then cp "$SRC" "$RUNNER_TEMP/primary-active-state/$f"; fi
          done

      - name: Free-tier quota gate for targeted fallback
        if: steps.fallback_gate.outputs.run_fallback == 'true'
        run: python code/flight-data-bridge/private-env-template/scripts/private_runtime.py quota-check

      - name: Build targeted 26 Oct to 04 Nov fallback config
        if: steps.fallback_gate.outputs.run_fallback == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          src=os.path.join(os.environ['RUNNER_TEMP'],'live-runtime.json')
          dst=os.path.join(os.environ['RUNNER_TEMP'],'fallback-runtime.json')
          d=json.load(open(src))
          d['outbound_departure_dates']=['2026-10-26']
          d['allowed_lis_arrival_dates']=['2026-10-27']
          d['return_departure_date']='2026-11-04'
          d['expected_queries_per_complete_provider']=4
          json.dump(d,open(dst,'w'),ensure_ascii=False,indent=2)
          PY

      - name: Execute targeted 04 Nov fallback cycle
        id: bridge_fallback
        if: steps.fallback_gate.outputs.run_fallback == 'true'
        shell: bash
        run: |
          set +e
          PYTHONPATH="$FLIGHT_BRIDGE_CODE_DIR" python -m flight_bridge.bridge \
            --out-dir "$RUNNER_TEMP/flight-output-fallback" \
            --config "$RUNNER_TEMP/fallback-runtime.json"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized fallback artifacts and quota usage
        if: steps.fallback_gate.outputs.run_fallback == 'true' && steps.bridge_fallback.outcome == 'success'
        run: |
          python code/flight-data-bridge/private-env-template/scripts/private_runtime.py persist \
            --output-dir "$RUNNER_TEMP/flight-output-fallback" \
            --health-file "$RUNNER_TEMP/no-health.json"

      - name: Keep fallback only when it produces a verified alert candidate
        id: fallback_result
        if: steps.fallback_gate.outputs.run_fallback == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p='code/flight-data-bridge/private-env-template/live/last-attempt.json'
          keep=False
          if os.path.exists(p):
              d=json.load(open(p))
              m=d.get('SEARCH_METADATA') or {}
              keep=(m.get('IS_COMPLETE') is True and len(d.get('ALERT_CANDIDATES', [])) > 0)
          print('keep_fallback=' + ('true' if keep else 'false'))
          PY

      - name: Restore primary active state when fallback has no verified candidate
        if: steps.fallback_gate.outputs.run_fallback == 'true' && steps.fallback_result.outputs.keep_fallback != 'true'
        shell: bash
        run: |
          for f in last-attempt.json status.json last-complete.json; do
            SRC="$RUNNER_TEMP/primary-active-state/$f"
            DST="code/flight-data-bridge/private-env-template/live/$f"
            if [ -f "$SRC" ]; then cp "$SRC" "$DST"; fi
          done

      - name: Secret scan before persistence
        if: always() && steps.bridge_primary.outcome == 'success'
        run: python code/flight-data-bridge/private-env-template/scripts/private_runtime.py scan

      - name: Validate active successful cycle completeness
        if: steps.bridge_primary.outputs.exit_code == '0'
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('code/flight-data-bridge/private-env-template/live/last-attempt.json'))
          m=d['SEARCH_METADATA']
          assert m['IS_COMPLETE'] is True
          assert m['SEARCH_STATUS'] in {'COMPLETE','COMPLETE_WITH_SOURCE_ERRORS'}
          p=next(x for x in d['PROVIDER_RESULTS'] if x['provider']=='IGNAV')
          expected=p['PROVIDER_QUERIES_EXPECTED']
          assert expected in {4,12}
          assert p['PROVIDER_QUERIES_STARTED']==expected
          assert p['PROVIDER_QUERIES_COMPLETE']==expected
          assert p['PROVIDER_QUERIES_FAILED']==0
          assert p['PROVIDER_QUERIES_TIMED_OUT']==0
          assert p['QUERY_GRID_VALID'] is True
          assert d['PROTOCOL_VERSION']=='LISBOA_V2.2'
          if expected == 4:
              jobs=(m.get('QUERY_PARAMETERS') or {}).get('jobs') or []
              assert len(jobs)==4
              assert all(j.get('outbound_date')=='2026-10-26' for j in jobs)
              assert all(j.get('return_destination') in {'GRU','VCP'} for j in jobs)
              assert all((o.get('outbound') or {}).get('arrival_date_local')=='2026-10-27' for o in d.get('ALERT_CANDIDATES', []))
              assert all(((o.get('inbound') or {}).get('departure_local') or '')[:10]=='2026-11-04' for o in d.get('ALERT_CANDIDATES', []))
          PY

      - name: Copy sanitized artifacts to live-data branch
        if: always() && steps.bridge_primary.outcome == 'success'
        shell: bash
        run: |
          mkdir -p live-repo/flight-live/live live-repo/flight-live/history live-repo/flight-live/price-history live-repo/flight-live/audit
          for d in live history price-history audit; do
            SRC="code/flight-data-bridge/private-env-template/$d"
            DST="live-repo/flight-live/$d"
            if [ -d "$SRC" ]; then cp -a "$SRC/." "$DST/"; fi
          done

      - name: Commit sanitized cycle artifacts
        if: always() && steps.bridge_primary.outcome == 'success'
        shell: bash
        run: |
          cd live-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-live/live flight-live/history flight-live/price-history flight-live/audit
          if git diff --cached --quiet; then
            echo "No sanitized changes."
          else
            git commit -m "Record Flight Data Bridge production cycle"
            git pull --rebase origin flight-live-data
            git push origin HEAD:flight-live-data
          fi

      - name: Propagate non-conclusive primary cycle
        if: steps.bridge_primary.outputs.exit_code != '0'
        run: |
          echo "SEARCH_INCOMPLETE or provider failure; sanitized audit retained when available."
          exit 46
