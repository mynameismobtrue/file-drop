<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Comitê BTC Diário · Visual Permanente</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-btc-visualize="v1">
  <main class="shell" id="app" aria-live="polite">
    <div class="topline">
      <div class="brand">Comitê BTC Diário · V3.25</div>
      <div class="infra"><span class="dot" aria-hidden="true"></span><span id="infraText">Visual permanente</span></div>
    </div>
    <div id="banner" class="status-banner"></div>
    <div id="root" class="skeleton" aria-busy="true">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
